name: Integration Tests

on:
  # Run after merge to main
  push:
    branches: [ main ]

  # Run weekly on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read

# These tests publish to and delete from a single real Threads account, and the
# suite sweeps leftover test posts on start. Two concurrent runs would delete
# each other's in-flight posts, so runs queue instead of overlapping. Never set
# cancel-in-progress: a killed run is exactly what leaves posts behind.
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.21'
        
    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Run unit tests
      run: go test -v -race ./... -short
    
    - name: Run integration tests
      env:
        THREADS_CLIENT_ID: ${{ secrets.THREADS_CLIENT_ID }}
        THREADS_CLIENT_SECRET: ${{ secrets.THREADS_CLIENT_SECRET }}
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        THREADS_REDIRECT_URI: ${{ secrets.THREADS_REDIRECT_URI }}
        THREADS_TEST_IMG1: ${{ secrets.THREADS_TEST_IMG1 }}
        THREADS_TEST_IMG2: ${{ secrets.THREADS_TEST_IMG2 }}
        THREADS_TEST_VID1: ${{ secrets.THREADS_TEST_VID1 }}
      run: |
        cd tests/integration
        go test -v -tags=integration -timeout=30m
